name: Fetch Douliu Bike Availability

on:
  schedule:
    # 每日台灣時間 06:00 - 22:00（UTC 14:00 - 23:59 與 00:00 - 05:59），每 15 分鐘執行一次
    - cron: "*/15 14-23,0-5 * * *"
  # 允許在 GitHub Actions 介面手動點選「Run workflow」立即測試
  workflow_dispatch:

# 賦予 workflow 將檔案 commit 並 push 回 repository 的權限
permissions:
  contents: write

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Douliu bike data fetcher
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python fetch_douliu_bike.py

      - name: Commit and push CSV to data folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          # 僅在 data/ 有新增或變更檔案時才建立 commit，避免空 commit 報錯
          if git diff --staged --quiet; then
            echo "No new data changes to commit."
          else
            TW_TIME=$(TZ="Asia/Taipei" date "+%Y-%m-%d %H:%M:%S")
            git commit -m "chore: fetch Douliu bike data at ${TW_TIME} (TST)"
            git push
          fi
